name: Live-Referenzfragen pruefen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-references:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Zehn unabhaengige Referenzfragen pruefen
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: python -m evaluation.check_reference_set --expected-revision "$EXPECTED_REVISION" --output evaluation/results/reference-check.json
      - name: Ergebnis aufbewahren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-reference-result
          path: evaluation/results/reference-check.json
          if-no-files-found: warn
          retention-days: 7
